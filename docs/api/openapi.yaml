  /api/v1/nutrition/profile:
    get:
      tags:
      - nutrition-controller
      operationId: getOwnProfile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionProfileResponse"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Eligibility confirmation required or nutrition access disabled
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
    put:
      tags:
      - nutrition-controller
      operationId: saveOwnProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveNutritionProfileRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionProfileResponse"
        "400":
          description: Invalid profile or consent
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Eligibility confirmation required or nutrition access disabled
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Profile outside the FR-35 support range
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
