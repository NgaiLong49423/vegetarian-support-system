                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "ACCOUNT_LOCKED for a locked account, or the role may not use\
            \ this operation."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - {}
      - bearerAuth: []
