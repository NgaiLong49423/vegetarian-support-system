openapi: 3.1.1
info:
  title: Mâm Xanh API
  version: 0.5.0
  summary: REST API contract for the Mâm Xanh application
  description: >-
    Accepted API baseline for FR-03 Authentication & Account and FR-18 administrative catalogs. Implementation parameters
    listed as TBD in API.md require owner proposals and Tech Lead approval before the
    affected endpoints are implementation-ready. Documented endpoints are not claimed
    to be implemented.
servers:
  - url: /api/v1
    description: Version 1 relative base path
tags:
  - name: Authentication
    description: Registration, verification, login, and password recovery.
  - name: Administrative catalogs
    description: Administrator-only management of ingredients, measurement units, and ingredient-specific conversions.
paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register with email and password
      description: Creates an ACTIVE account with emailVerified=false and triggers a best-effort verification email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created with accountStatus ACTIVE and emailVerified false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '409':
          description: Email is already used by an active account.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /auth/email-verifications:
    post:
      tags: [Authentication]
      summary: Verify an email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '204':
          description: Email is verified; accountStatus is unchanged.
        '400':
          description: Verification token is invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /auth/email-verifications/resend:
    post:
      tags: [Authentication]
      summary: Request another verification email
      description: Invalidates the previous token when a new token is issued. Limited to one request per 60 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in with email and password
      description: >-
        On success, returns a Stateless JWT Access Token. Five consecutive failures trigger a ten-minute
        temporary block on the account without changing the account to LOCKED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful. Returns a Stateless JWT Access Token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          description: Email or password is incorrect.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Account email is not verified or the account is administratively locked.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
  /auth/google:
    post:
      tags: [Authentication]
      summary: Log in with a Google ID token
      description: >-
        Verifies the Google token signature, issuer, audience, and expiry. A first-time user receives
        an ACTIVE Member account. The stable Google subject is used as the external identity key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Google login successful. Returns a Stateless JWT Access Token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          description: Google ID token is invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /auth/password-resets:
    post:
      tags: [Authentication]
      summary: Request a password-reset email
      description: Always returns a neutral response so clients cannot discover whether an email exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Request accepted, regardless of whether the email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
  /auth/password-resets/confirm:
    post:
      tags: [Authentication]
      summary: Set a new password with a reset token
      description: Invalidates the used token and revokes all active sessions for the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: Password changed and existing sessions revoked.
        '400':
          description: Payload or reset token is invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /admin/ingredients:
    get:
      tags: [Administrative catalogs]
      summary: List or search standard ingredients
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: query
          required: false
          schema: {type: string, maxLength: 200}
          description: Case-insensitive match against the Vietnamese ingredient name or group.
      responses:
        '200': {$ref: '#/components/responses/IngredientListSuccess'}
        '403': {$ref: '#/components/responses/ForbiddenProblem'}
    post:
      tags: [Administrative catalogs]
      summary: Create a standard Vietnamese ingredient
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/IngredientSaveRequest'}}}
      responses:
        '201': {$ref: '#/components/responses/IngredientSuccess'}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '403': {$ref: '#/components/responses/ForbiddenProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
  /admin/ingredients/{ingredientId}:
    put:
      tags: [Administrative catalogs]
      summary: Update a standard ingredient
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IngredientId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/IngredientSaveRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/IngredientSuccess'}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '403': {$ref: '#/components/responses/ForbiddenProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
    delete:
      tags: [Administrative catalogs]
      summary: Reject hard deletion of an ingredient
      description: Hard deletion is prohibited; use the status endpoint to deactivate the ingredient and preserve history.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IngredientId'}]
      responses:
        '409': {$ref: '#/components/responses/HardDeleteProblem'}
        '403': {$ref: '#/components/responses/ForbiddenProblem'}
  /admin/ingredients/{ingredientId}/status:
    patch:
      tags: [Administrative catalogs]
      summary: Activate or deactivate an ingredient
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IngredientId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CatalogStatusUpdateRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/IngredientSuccess'}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '403': {$ref: '#/components/responses/ForbiddenProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
  /admin/units:
    get:
      tags: [Administrative catalogs]
      summary: List measurement units
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/UnitListSuccess'}
        '403': {$ref: '#/components/responses/ForbiddenProblem'}
    post:
      tags: [Administrative catalogs]
      summary: Create a measurement unit
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UnitSaveRequest'}}}
      responses:
        '201': {$ref: '#/components/responses/UnitSuccess'}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '403': {$ref: '#/components/responses/ForbiddenProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
  /admin/units/{unitId}:
    put:
      tags: [Administrative catalogs]
      summary: Update a measurement unit
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UnitId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UnitSaveRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/UnitSuccess'}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '403': {$ref: '#/components/responses/ForbiddenProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
    delete:
      tags: [Administrative catalogs]
      summary: Reject hard deletion of a measurement unit
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UnitId'}]
      responses:
        '409': {$ref: '#/components/responses/HardDeleteProblem'}
        '403': {$ref: '#/components/responses/ForbiddenProblem'}
  /admin/units/{unitId}/status:
    patch:
      tags: [Administrative catalogs]
      summary: Activate or deactivate a measurement unit
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UnitId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CatalogStatusUpdateRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/UnitSuccess'}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '403': {$ref: '#/components/responses/ForbiddenProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
  /admin/ingredient-unit-conversions:
    get:
      tags: [Administrative catalogs]
      summary: List ingredient-specific unit conversions
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: ingredientId
          required: false
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200': {$ref: '#/components/responses/ConversionListSuccess'}
        '403': {$ref: '#/components/responses/ForbiddenProblem'}
  /admin/ingredients/{ingredientId}/unit-conversions/{unitId}:
    post:
      tags: [Administrative catalogs]
      summary: Configure grams per unit for one ingredient-unit pair
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IngredientId'}, {$ref: '#/components/parameters/UnitId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ConversionSaveRequest'}}}
      responses:
        '201': {$ref: '#/components/responses/ConversionSuccess'}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '403': {$ref: '#/components/responses/ForbiddenProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
    put:
      tags: [Administrative catalogs]
      summary: Update grams per unit for one ingredient-unit pair
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IngredientId'}, {$ref: '#/components/parameters/UnitId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ConversionSaveRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/ConversionSuccess'}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '403': {$ref: '#/components/responses/ForbiddenProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
  /admin/ingredients/{ingredientId}/unit-conversions/{unitId}/status:
    patch:
      tags: [Administrative catalogs]
      summary: Activate or deactivate a conversion rule
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IngredientId'}, {$ref: '#/components/parameters/UnitId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CatalogStatusUpdateRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/ConversionSuccess'}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '403': {$ref: '#/components/responses/ForbiddenProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
components:
  parameters:
    IngredientId:
      in: path
      name: ingredientId
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    UnitId:
      in: path
      name: unitId
      required: true
      schema: {type: integer, format: int32, minimum: 1}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    IngredientSaveRequest:
      type: object
      additionalProperties: false
      required: [name, ingredientGroup, sourceName, referenceDate]
      properties:
        name: {type: string, minLength: 1, maxLength: 200, example: Chuối tây, description: Vietnamese standard name only; MVP does not store English names.}
        ingredientGroup: {type: string, minLength: 1, maxLength: 100, example: Trái cây}
        sourceName: {type: string, minLength: 1, maxLength: 200, example: USDA}
        sourceUrl: {type: [string, 'null'], maxLength: 2048, format: uri}
        referenceDate: {type: string, format: date, example: '2026-09-01'}
    UnitSaveRequest:
      type: object
      additionalProperties: false
      required: [code, name, dimension, baseFactor]
      properties:
        code: {type: string, minLength: 1, maxLength: 20, example: quả}
        name: {type: string, minLength: 1, maxLength: 50, example: Quả}
        dimension: {type: string, enum: [MASS, VOLUME, COUNT]}
        baseFactor: {type: number, minimum: 0.000001, example: 1}
    ConversionSaveRequest:
      type: object
      additionalProperties: false
      required: [gramsPerUnit, approximate]
      properties:
        gramsPerUnit: {type: number, exclusiveMinimum: 0, example: 120}
        approximate: {type: boolean, example: true}
    CatalogStatusUpdateRequest:
      type: object
      additionalProperties: false
      required: [active]
      properties:
        active: {type: boolean, example: false}
    Ingredient:
      type: object
      required: [id, name, ingredientGroup, sourceName, referenceDate, nutritionSupported, active]
      properties:
        id: {type: integer, format: int64, example: 1}
        name: {type: string, example: Chuối tây}
        ingredientGroup: {type: string, example: Trái cây}
        sourceName: {type: string, example: USDA}
        sourceUrl: {type: [string, 'null'], format: uri}
        referenceDate: {type: string, format: date}
        nutritionSupported: {type: boolean, description: False when the nine nutrition indicators are not yet complete.}
        active: {type: boolean}
    MeasurementUnit:
      type: object
      required: [id, code, name, dimension, baseFactor, active]
      properties:
        id: {type: integer, format: int32, example: 3}
        code: {type: string, example: quả}
        name: {type: string, example: Quả}
        dimension: {type: string, enum: [MASS, VOLUME, COUNT]}
        baseFactor: {type: number, example: 1}
        active: {type: boolean}
    IngredientUnitConversion:
      type: object
      required: [ingredientId, unitId, gramsPerUnit, approximate, active]
      properties:
        ingredientId: {type: integer, format: int64, example: 1}
        unitId: {type: integer, format: int32, example: 3}
        gramsPerUnit: {type: number, example: 120}
        approximate: {type: boolean, example: true}
        active: {type: boolean}
    IngredientSuccessResponse:
      type: object
      required: [success, message, data, timestamp]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        data: {$ref: '#/components/schemas/Ingredient'}
        timestamp: {type: string, format: date-time}
    IngredientListSuccessResponse:
      type: object
      required: [success, message, data, timestamp]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        data: {type: array, items: {$ref: '#/components/schemas/Ingredient'}}
        timestamp: {type: string, format: date-time}
    UnitSuccessResponse:
      type: object
      required: [success, message, data, timestamp]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        data: {$ref: '#/components/schemas/MeasurementUnit'}
        timestamp: {type: string, format: date-time}
    UnitListSuccessResponse:
      type: object
      required: [success, message, data, timestamp]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        data: {type: array, items: {$ref: '#/components/schemas/MeasurementUnit'}}
        timestamp: {type: string, format: date-time}
    ConversionSuccessResponse:
      type: object
      required: [success, message, data, timestamp]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        data: {$ref: '#/components/schemas/IngredientUnitConversion'}
        timestamp: {type: string, format: date-time}
    ConversionListSuccessResponse:
      type: object
      required: [success, message, data, timestamp]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        data: {type: array, items: {$ref: '#/components/schemas/IngredientUnitConversion'}}
        timestamp: {type: string, format: date-time}
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [displayName, email, password, confirmPassword]
      properties:
        displayName:
          type: string
          minLength: 3
          maxLength: 50
          example: Nguyễn An
        email:
          type: string
          format: email
          example: an.nguyen@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          writeOnly: true
          description: Must satisfy password-complexity rules (8-64 chars, max 72 bytes UTF-8).
        confirmPassword:
          type: string
          format: password
          minLength: 8
          writeOnly: true
          description: Must match password.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
    GoogleLoginRequest:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken:
          type: string
          writeOnly: true
          description: Google ID token returned by Google Identity Services.
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword, confirmPassword]
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          writeOnly: true
          description: Must satisfy password-complexity rules (8-64 chars, max 72 bytes UTF-8).
        confirmPassword:
          type: string
          format: password
          minLength: 8
          writeOnly: true
          description: Must match newPassword.
    RegistrationResponse:
      type: object
      additionalProperties: false
      required: [accountStatus, emailVerified, message]
      properties:
        accountStatus:
          type: string
          const: ACTIVE
        emailVerified:
          type: boolean
          const: false
        message:
          type: string
          example: Registration succeeded. Check your email to verify your address.
    AuthResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresInSeconds, account]
      properties:
        accessToken:
          type: string
          readOnly: true
          description: Short-lived JWT access token.
        tokenType:
          type: string
          const: Bearer
        expiresInSeconds:
          type: integer
          format: int64
          minimum: 1
          description: Runtime access-token lifetime; the configured value is TBD for FR-03 implementation.
        account:
          $ref: '#/components/schemas/AccountSummary'
    AccountSummary:
      type: object
      additionalProperties: false
      required: [id, displayName, email, role, accountStatus, emailVerified]
      properties:
        id:
          type: integer
          format: int64
          example: 101
        displayName:
          type: string
        email:
          type: string
          format: email
        avatarUrl:
          type: [string, 'null']
          format: uri
        role:
          type: string
          enum: [CUSTOMER, EXPERT, ADMIN]
        accountStatus:
          type: string
          const: ACTIVE
        emailVerified:
          type: boolean
          const: true
    MessageResponse:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    ProblemDetails:
      type: object
      additionalProperties: true
      required: [title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          example: VALIDATION_FAILED
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
  responses:
    IngredientSuccess:
      description: Ingredient operation succeeded.
      content: {application/json: {schema: {$ref: '#/components/schemas/IngredientSuccessResponse'}}}
    IngredientListSuccess:
      description: Ingredient list retrieved.
      content: {application/json: {schema: {$ref: '#/components/schemas/IngredientListSuccessResponse'}}}
    UnitSuccess:
      description: Unit operation succeeded.
      content: {application/json: {schema: {$ref: '#/components/schemas/UnitSuccessResponse'}}}
    UnitListSuccess:
      description: Unit list retrieved.
      content: {application/json: {schema: {$ref: '#/components/schemas/UnitListSuccessResponse'}}}
    ConversionSuccess:
      description: Conversion operation succeeded.
      content: {application/json: {schema: {$ref: '#/components/schemas/ConversionSuccessResponse'}}}
    ConversionListSuccess:
      description: Conversion list retrieved.
      content: {application/json: {schema: {$ref: '#/components/schemas/ConversionListSuccessResponse'}}}
    ForbiddenProblem:
      description: Caller is authenticated but is not an Administrator.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}
    NotFoundProblem:
      description: Requested catalog record does not exist.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}
    ConflictProblem:
      description: A unique catalog value or ingredient-unit pair already exists, or the referenced catalog entry is inactive.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}
    HardDeleteProblem:
      description: Hard deletion is intentionally not supported; use the status endpoint instead.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}
    ValidationProblem:
      description: Request validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    RateLimitProblem:
      description: Request rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds until another attempt is accepted.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
