  /api/v1/recipes:
    get:
      tags:
      - recipe-post-controller
      operationId: searchPublic
      parameters:
      - name: keyword
        in: query
        description: Tìm trong tiêu đề và mô tả ngắn công thức.
        required: false
        schema:
          type: string
          default: ""
      - name: page
        in: query
        description: Số trang bắt đầu từ 0.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        description: Số công thức mỗi trang (từ 1 đến 50).
        required: false
        schema:
          type: integer
          format: int32
          default: 12
          maximum: 50
          minimum: 1
      - name: sort
        in: query
        description: Chế độ sắp xếp công thức công khai.
        required: false
        schema:
          type: string
          default: NEWEST
          enum:
          - NEWEST
          - MOST_LIKED
          - MOST_VIEWED
          - MOST_COMMENTED
          - MOST_ACTIVE
          - TRENDING
      - name: viewPeriod
        in: query
        description: Khung thời gian cho MOST_VIEWED; mặc định ALL_TIME.
        required: false
        schema:
          type: string
          default: ALL_TIME
          enum:
          - ALL_TIME
          - LAST_24_HOURS
          - LAST_7_DAYS
          - LAST_30_DAYS
      - name: vegetarianType
        in: query
        description: Loại ăn chay chuẩn.
        required: false
        schema:
          type: string
          enum:
          - VEGAN
          - LACTO
          - OVO
          - LACTO_OVO
      - name: dishCategory
        in: query
        description: Mã thể loại món chuẩn hóa.
        required: false
        schema:
          type: string
          enum:
          - NOODLE_SOUP
          - STIR_FRY
          - HOT_POT
          - BRAISED
          - SOUP
          - FRIED
          - STEAMED
          - SALAD
          - ROLL
          - GRILLED
          - DESSERT
      - name: ingredientIds
        in: query
        description: ID nguyên liệu; có thể lặp lại. Công thức phải chứa tất cả ID
          đã chọn.
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
          maxItems: 20
          minItems: 0
      - name: maxTotalTimeMinutes
        in: query
        description: "Tổng thời gian chuẩn bị và nấu tối đa, tính bằng phút."
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecipePageResponse"
        "400":
          description: "VALIDATION_FAILED: malformed body or a field/parameter outside\
            \ its rules; details in `errors`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    post:
      tags:
      - recipe-controller
      operationId: publish
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecipeRequest"
        required: true
      responses:
        "201":
          description: The published Recipe Post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRecipeResponse"
        "400":
          description: "VALIDATION_FAILED: the recipe breaks the validation profile;\
            \ field errors in `errors`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "ACCESS_DENIED: only an active Expert publishes recipes, or\
            \ ACCOUNT_LOCKED."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: "UNAUTHENTICATED: missing, invalid or expired access token."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
