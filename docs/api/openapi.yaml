  /api/v1/members/{userId}/follow:
    get:
      tags:
      - member-follow-controller
      summary: Read a member's follow summary
      description: "Public. Counts include only active accounts. With an access token,\
        \ `following` tells whether the viewer follows this member."
      operationId: status
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        "200":
          description: Follow summary of the member profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowStatusResponse"
        "404":
          description: "MEMBER_PROFILE_NOT_FOUND: no member profile has this id."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "400":
          description: "VALIDATION_FAILED: malformed body or a field/parameter outside\
            \ its rules; details in `errors`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    put:
      tags:
      - member-follow-controller
      summary: Follow a member
      description: Idempotent. The follower is the authenticated account; a repeated
        request keeps one relation.
      operationId: follow
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        "200":
          description: The current account follows the member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowStatusResponse"
        "401":
          description: Authentication is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: MEMBER_ACCESS_REQUIRED for a non-member account; FOLLOW_SELF_NOT_ALLOWED
            on the own profile.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: "MEMBER_PROFILE_NOT_FOUND: no member profile has this id."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: "FOLLOW_TARGET_INACTIVE: the member account is locked."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "400":
          description: "VALIDATION_FAILED: malformed body or a field/parameter outside\
            \ its rules; details in `errors`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
    delete:
      tags:
      - member-follow-controller
      summary: Unfollow a member
      description: "Idempotent. Removes only the authenticated account's relation,\
        \ also when the member is locked."
      operationId: unfollow
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        "200":
          description: The current account does not follow the member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowStatusResponse"
        "401":
          description: Authentication is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: MEMBER_ACCESS_REQUIRED for a non-member account; FOLLOW_SELF_NOT_ALLOWED
            on the own profile.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: "MEMBER_PROFILE_NOT_FOUND: no member profile has this id."
          content:
            application/problem+json:
              schema:
