# Migration reference only: planned Auth endpoints may not exist in the running Backend yet.
# Implemented endpoints are evidenced by springdoc at /v3/api-docs; do not treat this file as
# a second permanent runtime authority. See API.md for the migration policy.
openapi: 3.1.1
info:
  title: Mâm Xanh API
  version: 0.8.0
  summary: REST API contract for the Mâm Xanh application
  description: >-
    No planned endpoints remain: every endpoint is implemented and documented by generated
    Springdoc OpenAPI at /v3/api-docs.
servers:
  - url: /api/v1
    description: Version 1 relative base path
paths: {}
components:
  schemas:
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    ProblemDetails:
      type: object
      additionalProperties: true
      required: [title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          example: VALIDATION_FAILED
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
  responses:
    AuthenticationProblem:
      description: Authentication is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    AccessProblem:
      description: An active Member account is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    OutOfScopeProblem:
      description: The declared case is outside the application's nutrition reference scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationProblem:
      description: Request validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    RateLimitProblem:
      description: Request rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds until another attempt is accepted.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
