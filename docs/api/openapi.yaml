components:
  schemas:
    UpdateShoppingItemRequest:
      type: object
      properties:
        quantity:
          type: number
          minimum: 0
        unitId:
          type: integer
          format: int32
          minimum: 0
      required:
      - quantity
      - unitId
    ProblemDetail:
      type: object
      description: "RFC 9457 problem detail; clients branch on `status` and `code`,\
        \ never on `detail` text."
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable `ErrorCode` value.
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    ShoppingListItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        ingredientId:
          type:
          - integer
          - "null"
          format: int64
        name:
          type: string
        ingredientGroup:
          type: string
        imageUrl:
          type:
          - string
          - "null"
          description: Ingredient catalog illustration URL; null when unavailable.
        quantity:
          type: number
        unitId:
          type: integer
          format: int32
        unitCode:
          type: string
        unitName:
          type: string
        bought:
          type: boolean
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ShoppingRecipeSource"
    ShoppingRecipeSource:
      type: object
      properties:
        recipeId:
          type: integer
          format: int64
        title:
          type:
          - string
          - "null"
        available:
          type: boolean
        originalQuantity:
          type: number
        originalUnitId:
          type: integer
          format: int32
        originalUnitCode:
          type: string
    Ingredient:
      type: object
      properties:
        ingredientId:
          type: integer
          format: int64
        name:
          type: string
        customName:
          type: string
        unitId:
          type: integer
          format: int32
        unitCode:
          type: string
        unitName:
          type: string
        quantity:
          type: number
    UpdateRecipePostRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 120
          minLength: 3
        description:
          type: string
          maxLength: 2000
          minLength: 0
        instructions:
          type: string
          maxLength: 5000
          minLength: 10
        dishCategory:
          type: string
          minLength: 1
          pattern: NOODLE_SOUP|STIR_FRY|HOT_POT|BRAISED|SOUP|FRIED|STEAMED|SALAD|ROLL|GRILLED|DESSERT
        vegetarianType:
          type: string
          minLength: 1
          pattern: VEGAN|LACTO|OVO|LACTO_OVO
        difficulty:
          type: string
          minLength: 1
          pattern: EASY|MEDIUM|HARD
        servings:
          type: integer
          format: int32
          maximum: 50
          minimum: 1
        prepTimeMin:
          type: integer
          format: int32
          maximum: 1440
          minimum: 0
        cookTimeMin:
          type: integer
          format: int32
          maximum: 1440
          minimum: 0
        youtubeUrl:
          type: string
          maxLength: 2048
          minLength: 0
          pattern: ^$|https?://(www\.)?(youtube\.com|youtu\.be)/.+
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/Ingredient"
          maxItems: 50
          minItems: 1
      required:
      - cookTimeMin
      - difficulty
      - dishCategory
      - ingredients
      - instructions
      - prepTimeMin
      - servings
      - title
      - vegetarianType
    Media:
      type: object
      properties:
        url:
          type: string
        mimeType:
          type: string
        displayOrder:
          type: integer
          format: int32
        cover:
          type: boolean
    RecipePostResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        authorId:
          type: integer
          format: int64
        authorName:
          type: string
        authorAvatarUrl:
          type: string
        title:
          type: string
        description:
          type: string
        instructions:
          type: string
        dishCategory:
          type: string
        vegetarianType:
          type: string
        difficulty:
          type: string
        servings:
          type: integer
          format: int32
        prepTimeMin:
          type: integer
          format: int32
        cookTimeMin:
          type: integer
          format: int32
        youtubeUrl:
          type: string
        status:
          type: string
        media:
          type: array
          items:
            $ref: "#/components/schemas/Media"
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/Ingredient"
        likes:
          type: integer
          format: int64
        dislikes:
          type: integer
          format: int64
        likePercentage:
          type: number
        viewCount:
          type: integer
          format: int64
    SetRecipeReactionRequest:
      type: object
      properties:
        reactionType:
          type: string
          enum:
          - LIKE
          - DISLIKE
      required:
      - reactionType
    RecipeReactionResponse:
      type: object
      properties:
        recipeId:
          type: integer
          format: int64
        currentReaction:
          type:
          - string
          - "null"
          description: Lựa chọn của Member hiện tại; null khi chưa bình chọn.
          enum:
          - LIKE
          - DISLIKE
        likes:
          type: integer
          format: int64
        dislikes:
          type: integer
          format: int64
        reactionCount:
          type: integer
          format: int64
        likePercentage:
          type:
          - number
          - "null"
          description: Tỷ lệ Like làm tròn thành số nguyên; null khi chưa có bình
            chọn.
    RecipeMediaItemRequest:
      type: object
      properties:
        blobUrl:
          type: string
          minLength: 1
        mimeType:
          type: string
          minLength: 1
          pattern: ^(image/jpeg|image/png|image/webp)$
        displayOrder:
          type: integer
          format: int32
          maximum: 5
          minimum: 1
        isCover:
          type: boolean
      required:
      - blobUrl
      - displayOrder
      - isCover
      - mimeType
    UpdateRecipeMediaRequest:
      type: object
      properties:
        mediaItems:
          type: array
          items:
            $ref: "#/components/schemas/RecipeMediaItemRequest"
          maxItems: 5
          minItems: 0
    ApiResponseListRecipeMediaResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/RecipeMediaResponse"
        timestamp:
          type: string
          format: date-time
    RecipeMediaResponse:
      type: object
      properties:
        mediaId:
          type: integer
          format: int64
        recipeId:
          type: integer
          format: int64
        blobUrl:
          type: string
        mimeType:
          type: string
        displayOrder:
          type: integer
          format: int32
        isCover:
          type: boolean
    SaveNutritionProfileRequest:
      type: object
      properties:
        dateOfBirth:
          type: string
          format: date
        biologicalSex:
          type: string
          minLength: 1
        heightCm:
          type: number
          maximum: 250.0
          minimum: 100.0
        weightKg:
          type: number
          maximum: 300.0
          minimum: 30.0
        activityLevel:
          type: string
          minLength: 1
        nutritionGoal:
          type: string
        pregnant:
          type: boolean
        breastfeeding:
          type: boolean
        therapeuticDietRequired:
          type: boolean
        consentAccepted:
          type: boolean
      required:
      - activityLevel
      - biologicalSex
      - breastfeeding
      - consentAccepted
      - dateOfBirth
      - heightCm
      - pregnant
      - therapeuticDietRequired
      - weightKg
    NutritionProfileResponse:
      type: object
      properties:
        hasProfile:
          type: boolean
        eligible:
          type: boolean
        outOfScopeReasons:
          type: array
          items:
            type: string
        profile:
          $ref: "#/components/schemas/Profile"
        results:
          $ref: "#/components/schemas/Results"
