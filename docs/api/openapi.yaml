# Migration reference only: planned Auth endpoints may not exist in the running Backend yet.
# Implemented endpoints are evidenced by springdoc at /v3/api-docs; do not treat this file as
# a second permanent runtime authority. See API.md for the migration policy.
openapi: 3.1.1
info:
  title: Mâm Xanh API
  version: 0.7.0
  summary: REST API contract for the Mâm Xanh application
  description: >-
    Planned reference for password recovery endpoints not implemented in runtime.
    Implemented endpoints are documented by generated Springdoc OpenAPI.
servers:
  - url: /api/v1
    description: Version 1 relative base path
tags:
  - name: Authentication
    description: Password recovery.
paths:
  /auth/password-resets:
    post:
      tags: [Authentication]
      summary: Request a password-reset email
      description: Always returns a neutral response so clients cannot discover whether an email exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Request accepted, regardless of whether the email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
  /auth/password-resets/confirm:
    post:
      tags: [Authentication]
      summary: Set a new password with a reset token
      description: Sets a new password using a valid reset token and invalidates the token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: Password changed successfully.
        '400':
          description: Payload or reset token is invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword, confirmPassword]
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          writeOnly: true
          description: Must satisfy password-complexity rules (8-64 chars, max 72 bytes UTF-8).
        confirmPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          writeOnly: true
          description: Must match newPassword.
    MessageResponse:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    ProblemDetails:
      type: object
      additionalProperties: true
      required: [title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          example: VALIDATION_FAILED
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
  responses:
    AuthenticationProblem:
      description: Authentication is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    AccessProblem:
      description: An active Member account is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    OutOfScopeProblem:
      description: The declared case is outside the application's nutrition reference scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationProblem:
      description: Request validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    RateLimitProblem:
      description: Request rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds until another attempt is accepted.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
