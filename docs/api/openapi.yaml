openapi: 3.1.1
info:
  title: Mâm Xanh API
  version: 0.4.1
  summary: REST API contract for the Mâm Xanh application
  description: >-
    Accepted API baseline for FR-03 Authentication & Account. Implementation parameters
    listed as TBD in API.md require owner proposals and Tech Lead approval before the
    affected endpoints are implementation-ready. Documented endpoints are not claimed
    to be implemented.
servers:
  - url: /api/v1
    description: Version 1 relative base path
tags:
  - name: Authentication
    description: Registration, verification, login, and password recovery.
paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register with email and password
      description: Creates an ACTIVE account with emailVerified=false and triggers a best-effort verification email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created with accountStatus ACTIVE and emailVerified false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '409':
          description: Email is already used by another account (code EMAIL_ALREADY_USED); comparison ignores case.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /auth/email-verifications:
    post:
      tags: [Authentication]
      summary: Verify an email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '204':
          description: Email is verified; accountStatus is unchanged.
        '400':
          description: >-
            Verification token is unknown, already used, replaced by a newer token or expired
            (code VERIFICATION_TOKEN_INVALID), or the payload is invalid (code VALIDATION_FAILED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /auth/email-verifications/resend:
    post:
      tags: [Authentication]
      summary: Request another verification email
      description: >-
        Invalidates the previous token when a new token is issued. Limited to one email per 60 seconds;
        earlier requests return 429 with code RESEND_TOO_SOON and Retry-After. Unknown and already verified
        emails receive the same 202 response and no email is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in with email and password
      description: >-
        On success, returns a Stateless JWT Access Token. Five consecutive failures trigger a ten-minute
        temporary block on the account without changing the account to LOCKED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful. Returns a Stateless JWT Access Token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          description: Email or password is incorrect.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Account email is not verified or the account is administratively locked.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
  /auth/google:
    post:
      tags: [Authentication]
      summary: Log in with a Google ID token
      description: >-
        Verifies the Google token signature, issuer, audience, and expiry. A first-time user receives
        an ACTIVE Member account. The stable Google subject is used as the external identity key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Google login successful. Returns a Stateless JWT Access Token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          description: Google ID token is invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Account is administratively locked (ACCOUNT_LOCKED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Email is already linked to a different Google account (GOOGLE_ACCOUNT_CONFLICT).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /auth/password-resets:
    post:
      tags: [Authentication]
      summary: Request a password-reset email
      description: Always returns a neutral response so clients cannot discover whether an email exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Request accepted, regardless of whether the email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
  /auth/password-resets/confirm:
    post:
      tags: [Authentication]
      summary: Set a new password with a reset token
      description: Sets a new password using a valid reset token and invalidates the token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: Password changed successfully.
        '400':
          description: Payload or reset token is invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [displayName, email, password, confirmPassword]
      properties:
        displayName:
          type: string
          minLength: 3
          maxLength: 50
          example: Nguyễn An
        email:
          type: string
          format: email
          example: an.nguyen@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          writeOnly: true
          description: Must satisfy password-complexity rules (8-64 chars, max 72 bytes UTF-8).
        confirmPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          writeOnly: true
          description: Must match password.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
    GoogleLoginRequest:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken:
          type: string
          writeOnly: true
          description: Google ID token returned by Google Identity Services.
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword, confirmPassword]
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          writeOnly: true
          description: Must satisfy password-complexity rules (8-64 chars, max 72 bytes UTF-8).
        confirmPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          writeOnly: true
          description: Must match newPassword.
    RegistrationResponse:
      type: object
      additionalProperties: false
      required: [accountStatus, emailVerified, message]
      properties:
        accountStatus:
          type: string
          const: ACTIVE
        emailVerified:
          type: boolean
          const: false
        message:
          type: string
          example: Registration succeeded. Check your email to verify your address.
    AuthResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresInSeconds, account]
      properties:
        accessToken:
          type: string
          readOnly: true
          description: Short-lived JWT access token.
        tokenType:
          type: string
          const: Bearer
        expiresInSeconds:
          type: integer
          format: int64
          minimum: 1
          description: Runtime access-token lifetime; the configured value is TBD for FR-03 implementation.
        account:
          $ref: '#/components/schemas/AccountSummary'
    AccountSummary:
      type: object
      additionalProperties: false
      required: [id, displayName, email, role, accountStatus, emailVerified]
      properties:
        id:
          type: integer
          format: int64
          example: 101
        displayName:
          type: string
        email:
          type: string
          format: email
        avatarUrl:
          type: [string, 'null']
          format: uri
        role:
          type: string
          enum: [CUSTOMER, EXPERT, ADMIN]
        accountStatus:
          type: string
          const: ACTIVE
        emailVerified:
          type: boolean
          const: true
    MessageResponse:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    ProblemDetails:
      type: object
      additionalProperties: true
      required: [title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          example: VALIDATION_FAILED
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
  responses:
    ValidationProblem:
      description: Request validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    RateLimitProblem:
      description: Request rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds until another attempt is accepted.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
