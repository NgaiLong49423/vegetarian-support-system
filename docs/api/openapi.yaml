openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/v1/shopping-lists/{listId}/items/{itemId}:
    put:
      tags:
      - shopping-list-controller
      summary: Edit a shopping item's quantity and unit
      description: Preserves ingredient identity and bought state. An existing inactive
        unit may be retained; a newly selected unit must be active.
      operationId: updateShoppingItem
      parameters:
      - name: listId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShoppingItemRequest"
        required: true
      responses:
        "400":
          description: "Invalid ID, pagination or payload."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: A valid access token is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: An active Member account is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: List/item does not exist or does not belong to the current
            Member/list.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "200":
          description: The updated item.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ShoppingListItemResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - shopping-list-controller
      summary: Delete one item from an owned shopping list
      operationId: deleteShoppingItem
      parameters:
      - name: listId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "400":
          description: "Invalid ID, pagination or payload."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: A valid access token is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: An active Member account is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: List/item does not exist or does not belong to the current
            Member/list.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "204":
          description: The item was deleted.
      security:
      - bearerAuth: []
  /api/v1/saved-recipes/{recipeId}:
    put:
      tags:
      - saved-recipe-controller
      summary: Save a published recipe for the current member
      description: Idempotent. The account ID is derived from the authenticated principal.
      operationId: save
      parameters:
      - name: recipeId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: The recipe is saved or was already saved.
        "401":
          description: Authentication is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: An active Member account is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: The recipe is not public and available.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "400":
          description: "VALIDATION_FAILED: malformed body or a field/parameter outside\
            \ its rules; details in `errors`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
    delete:
      tags:
      - saved-recipe-controller
      summary: Remove a recipe from the current member's saved list
      description: "Idempotent. Removes only the current member's reference, including\
        \ an unavailable recipe."
      operationId: unsave
      parameters:
      - name: recipeId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: The saved reference is removed or did not exist.
        "401":
          description: Authentication is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: An active Member account is required.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "400":
          description: "VALIDATION_FAILED: malformed body or a field/parameter outside\
            \ its rules; details in `errors`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
  /api/v1/recipes/{recipeId}:
    get:
      tags:
      - recipe-controller
      summary: Get a published recipe detail
      description: "Returns the current RecipePost projection, including public author,\
        \ ingredients, ordered media, nutrition estimates, and read statistics."
      operationId: recipeDetail
      parameters:
      - name: recipeId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Published recipe detail returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetailResponse"
        "404":
          description: Recipe does not exist or is not public.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "400":
          description: "VALIDATION_FAILED: malformed body or a field/parameter outside\
            \ its rules; details in `errors`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    put:
      tags:
      - recipe-post-controller
      operationId: update
      parameters:
      - name: recipeId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecipePostRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecipePostResponse"
        "400":
          description: "VALIDATION_FAILED: malformed body or a field/parameter outside\
            \ its rules; details in `errors`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: "UNAUTHENTICATED: missing, invalid or expired access token."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "ACCOUNT_LOCKED for a locked account, or the role may not use\
            \ this operation."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
    delete:
      tags:
      - recipe-post-controller
      operationId: delete
      parameters:
      - name: recipeId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        "200":
          description: OK
        "400":
          description: "VALIDATION_FAILED: malformed body or a field/parameter outside\
            \ its rules; details in `errors`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: "UNAUTHENTICATED: missing, invalid or expired access token."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "ACCOUNT_LOCKED for a locked account, or the role may not use\
            \ this operation."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
  /api/v1/recipes/{recipeId}/reaction:
    get:
      tags:
      - recipe-reaction-controller
