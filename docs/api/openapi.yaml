                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Không đủ quyền; tài khoản khóa hoặc tác giả tự bình chọn
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Công thức không tồn tại hoặc không còn công khai
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
    put:
      tags:
      - recipe-reaction-controller
      summary: Đặt hoặc chuyển Like/Dislike
      description: PUT cùng lựa chọn giữ nguyên phản hồi; bấm lại nút đang chọn trên
        UI gọi DELETE để hủy.
      operationId: set
      parameters:
      - name: recipeId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRecipeReactionRequest"
        required: true
      responses:
        "200":
          description: Lựa chọn hiện tại và thống kê bình chọn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeReactionResponse"
        "400":
          description: ID hoặc loại phản hồi không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Chưa đăng nhập hoặc token không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Không đủ quyền; tài khoản khóa hoặc tác giả tự bình chọn
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Công thức không tồn tại hoặc không còn công khai
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
    delete:
      tags:
      - recipe-reaction-controller
      summary: Hủy phản hồi của Member hiện tại
      description: Trả lựa chọn null và thống kê mới; hủy lặp không thay đổi dữ liệu.
      operationId: remove
      parameters:
      - name: recipeId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        "200":
          description: Lựa chọn hiện tại và thống kê bình chọn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeReactionResponse"
        "400":
          description: ID hoặc loại phản hồi không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Chưa đăng nhập hoặc token không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Không đủ quyền; tài khoản khóa hoặc tác giả tự bình chọn
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Công thức không tồn tại hoặc không còn công khai
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
