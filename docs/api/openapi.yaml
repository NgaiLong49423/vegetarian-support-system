  /api/v1/recipes/ai/chat:
    post:
      tags:
      - ai-chat-controller
      summary: Ask the vegetarian cooking assistant
      description: Guest and active Member use the same chatbot. Guest sends a first-party
        cookie UUID in X-Guest-Chat-Id; without it the peer IP shares a fallback window.
        Guest limits are 10 requests per rolling minute per identity and 60 per peer
        IP. There is no daily quota. General context or the latest public RecipePost
        is loaded server-side. Recipe discovery selects only current public RecipePosts
        from the Backend catalog; explicitly requested recipe drafts remain chat text
        only. Conversation history is request-scoped and is not persisted.
      operationId: answer
      parameters:
      - name: X-Guest-Chat-Id
        in: header
        description: Optional Guest UUID from the first-party anonymous cookie. Not
          an authentication credential.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatRequest"
        required: true
      responses:
        "200":
          description: "AI answer and, when relevant, selected public recipe cards\
            \ generated."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AiChatResponse"
        "400":
          description: "Invalid question, history, or context fields."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: A supplied Bearer token is invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: GUEST_CHAT_RATE_LIMITED; no call is forwarded to Gemini.
          headers:
            Retry-After:
              description: Seconds until retry is allowed.
              style: simple
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: The recipe does not exist or is not public.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: Gemini returned an incomplete or invalid answer.
          content:
            application/problem+json:
              schema:
