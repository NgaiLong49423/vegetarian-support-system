name: mamxanh-dev

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-CU32-GDR11-ubuntu-20.04@sha256:ef0b8db33970ecd01bed49c3a84a1d083c435a9891718df619298b67b352e74a
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in app/mamxanh-backend/.env}
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in app/mamxanh-backend/.env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" > /dev/null
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  database-init:
    image: mcr.microsoft.com/mssql/server:2019-CU32-GDR11-ubuntu-20.04@sha256:ef0b8db33970ecd01bed49c3a84a1d083c435a9891718df619298b67b352e74a
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in app/mamxanh-backend/.env}
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in app/mamxanh-backend/.env}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        until /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -C -Q "SELECT 1" > /dev/null 2>&1; do sleep 2; done
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -C -Q "IF DB_ID(N'MamXanhDB') IS NULL CREATE DATABASE [MamXanhDB]"
    restart: "no"

  backend:
    build:
      context: ./app/mamxanh-backend
    depends_on:
      database-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=MamXanhDB;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in app/mamxanh-backend/.env}
      MAMXANH_FRONTEND_BASE_URL: http://localhost:5173
      MAMXANH_CORS_ALLOWED_ORIGINS: http://localhost:5173
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      MAMXANH_MAIL_FROM: ${MAMXANH_MAIL_FROM:-}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/v3/api-docs"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 120s

  frontend:
    build:
      context: ./app/mamxanh-frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./app/mamxanh-frontend:/workspace
      - frontend-node-modules:/workspace/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  frontend-node-modules:
  sqlserver-data:
