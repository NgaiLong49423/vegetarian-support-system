sonar.projectKey=NgaiLong49423_vegetarian-support-system
sonar.organization=ngailong49423
sonar.host.url=https://sonarcloud.io

# Source code
sonar.sources=app/mamxanh-frontend/src,app/mamxanh-backend/src/main

# Test code
sonar.tests=app/mamxanh-frontend/tests,app/mamxanh-backend/src/test

# Java bytecode generated by Maven
sonar.java.binaries=app/mamxanh-backend/target/classes
sonar.java.test.binaries=app/mamxanh-backend/target/test-classes

# JaCoCo coverage report
sonar.coverage.jacoco.xmlReportPaths=app/mamxanh-backend/target/site/jacoco/jacoco.xml

# Frontend Istanbul/NYC LCOV report
sonar.javascript.lcov.reportPaths=app/mamxanh-frontend/coverage/lcov.info

# Ignore generated/build/dependency directories
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**

# This repeatable Flyway demo fixture consists of bulk recipe rows, not duplicated application logic.
sonar.cpd.exclusions=app/mamxanh-backend/src/main/resources/db/demo/R__demo_sample_data_73_nguyen_hoang_phuc_dessert_collection.sql

sonar.sourceEncoding=UTF-8
