name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/mamxanh-frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/mamxanh-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E coverage gate
        run: npm run test:e2e:coverage

      - name: Summarize Frontend E2E coverage
        run: |
          npx nyc report --reporter=json-summary
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const { total } = require('./coverage/coverage-summary.json');

          console.log('## Frontend — Playwright E2E coverage');
          console.log('');
          console.log('| Metric | Coverage | Required |');
          console.log('| --- | ---: | ---: |');
          for (const metric of ['lines', 'statements', 'functions', 'branches']) {
            const label = metric[0].toUpperCase() + metric.slice(1);
            console.log(`| ${label} | ${total[metric].pct.toFixed(1)}% | ≥60% |`);
          }
          NODE

      - name: Upload frontend LCOV report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lcov
          path: app/mamxanh-frontend/coverage/lcov.info
          if-no-files-found: error

      - name: Upload Frontend HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-coverage-html
          path: app/mamxanh-frontend/coverage/
          if-no-files-found: error

  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/mamxanh-backend

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Test and package
        run: bash ./mvnw --batch-mode clean verify

      - name: Summarize Backend JaCoCo coverage
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          report = ET.parse('target/site/jacoco/jacoco.xml').getroot()
          line = next((counter for counter in report.findall('counter') if counter.get('type') == 'LINE'), None)
          if line is None:
              raise SystemExit('JaCoCo report does not contain a BUNDLE LINE counter')

          covered = int(line.get('covered', '0'))
          missed = int(line.get('missed', '0'))
          total = covered + missed
          if total == 0:
              raise SystemExit('JaCoCo BUNDLE LINE counter has no lines')

          print('## Backend — JaCoCo coverage')
          print()
          print('| Scope | Covered lines | Coverage | Required |')
          print('| --- | ---: | ---: | ---: |')
          print(f'| BUNDLE / LINE | {covered}/{total} | {covered / total * 100:.1f}% | ≥80% |')
          PY

      - name: Upload backend coverage and bytecode
        uses: actions/upload-artifact@v4
        with:
          name: backend-analysis
          path: |
            app/mamxanh-backend/target/site/jacoco/jacoco.xml
            app/mamxanh-backend/target/classes/
            app/mamxanh-backend/target/test-classes/
          if-no-files-found: error

      - name: Upload Backend JaCoCo HTML report
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-html
          path: app/mamxanh-backend/target/site/jacoco/
          if-no-files-found: error

  docker-development:
    name: Docker Development
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js for pinned Scalar CLI
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Build and smoke-test the shared development stack
        run: |
          set -euo pipefail
          export MSSQL_SA_PASSWORD="$(openssl rand -hex 20)Aa1!"
          cleanup() {
            docker compose -p mamxanh-ci down --volumes --remove-orphans
          }
          trap cleanup EXIT

          docker compose -p mamxanh-ci up --build --detach --wait --wait-timeout 600
          curl --fail --silent --show-error http://localhost:5173/
          curl --fail --silent --show-error http://localhost:8080/v3/api-docs \
            --output "$RUNNER_TEMP/openapi-runtime.json"
          npx --yes @scalar/cli@2.5.2 document validate "$RUNNER_TEMP/openapi-runtime.json"
          curl --fail --silent --show-error http://localhost:8080/scalar \
            --output "$RUNNER_TEMP/scalar-route.html"
          grep --fixed-strings 'API Reference' "$RUNNER_TEMP/scalar-route.html"
          grep --fixed-strings '@scalar/api-reference@1.72.3' "$RUNNER_TEMP/scalar-route.html"

      - name: Upload generated runtime OpenAPI
        uses: actions/upload-artifact@v4
        with:
          name: openapi-runtime-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openapi-runtime.json
          if-no-files-found: error

  sonar:
    name: Sonar
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: ${{ always() }}
    steps:
      - name: Require successful coverage jobs
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          test "$FRONTEND_RESULT" = success
          test "$BACKEND_RESULT" = success

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download frontend LCOV report
        uses: actions/download-artifact@v4
        with:
          name: frontend-lcov
          path: app/mamxanh-frontend/coverage

      - name: Download backend coverage and bytecode
        uses: actions/download-artifact@v4
        with:
          name: backend-analysis
          path: app/mamxanh-backend/target

      - name: Require both coverage reports
        run: |
          test -s app/mamxanh-frontend/coverage/lcov.info
          test -s app/mamxanh-backend/target/site/jacoco/jacoco.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        with:
          args: -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
