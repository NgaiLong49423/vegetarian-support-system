name: Bug Report
description: Báo bug trên develop/main, cung cấp bằng chứng để Tech Lead triage và giao owner
title: "fix: "
labels: ["🐛 Bug"]
body:
  - type: markdown
    attributes:
      value: |
        Bắt buộc dùng Bug Report form này; khi tạo qua CLI/API, giữ các mục và thông tin bắt buộc tương ứng. Không tự thay bằng format mới.
        Báo bug trên `develop`/`main` theo CONTRIBUTING.md. Lỗi riêng trên branch cá nhân tự xử lý; nếu lỗi đã có ở hai nhánh này hoặc chặn người khác thì vẫn báo. Không cần biết nguyên nhân/tác giả code mới được báo; Tech Lead xác nhận ưu tiên và owner.
  - type: dropdown
    id: affected_branch
    attributes:
      label: "Nhánh bị ảnh hưởng"
      options:
        - "develop"
        - "main"
        - "Branch cá nhân: lỗi gốc ở develop/main hoặc chặn người khác"
    validations:
      required: true
  - type: input
    id: tested_commit
    attributes:
      label: "Commit đã kiểm tra"
      description: "Ghi commit hash của phiên bản tái hiện lỗi; nếu chưa xác định, ghi rõ lý do để bổ sung."
    validations:
      required: true
  - type: input
    id: source_trace
    attributes:
      label: "FR/Issue/PR liên quan"
      description: "Liên kết nếu biết; chưa xác định thì để trống."
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: "1. Mô tả lỗi"
      description: "Mô tả ngắn gọn lỗi đang xảy ra."
      placeholder: "Mô tả chi tiết lỗi tại đây..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "2. Các bước tái hiện lỗi"
      description: "Ghi từng bước và dữ liệu kiểm tra để người khác tái hiện; không đưa thông tin riêng tư hoặc secrets."
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "3. Kết quả mong muốn"
      description: "Mô tả điều đáng lẽ phải xảy ra theo SRS/Acceptance Criteria; dẫn nguồn nếu biết."
      placeholder: "Mô tả kết quả mong muốn tại đây..."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "4. Kết quả thực tế"
      description: "Mô tả điều thực tế đã xảy ra."
      placeholder: "Mô tả kết quả thực tế tại đây..."
    validations:
      required: true
  - type: textarea
    id: screenshot-logs
    attributes:
      label: "5. Ảnh chụp màn hình hoặc Log"
      description: "Thêm screenshot/video/log nếu có; loại bỏ token, mật khẩu và dữ liệu riêng tư."
      placeholder: "Kéo thả ảnh hoặc dán log lỗi vào đây..."
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: "6. Môi trường chạy"
      description: "Cung cấp thông tin chi tiết về môi trường chạy ứng dụng."
      value: |
        - Hệ điều hành: 
        - Trình duyệt: 
        - Phiên bản Java: 
        - Server: 
        - Database: 
        - Công cụ/IDE: 
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: "7. Mức độ ảnh hưởng"
      description: "Chọn ảnh hưởng dự kiến; Tech Lead xác nhận ưu tiên xử lý. Nêu rõ nếu lỗi chặn chức năng, tích hợp hoặc demo trong mô tả."
      options:
        - "Thấp: lỗi nhỏ, không ảnh hưởng nhiều"
        - "Trung bình: ảnh hưởng một phần chức năng"
        - "Cao: chức năng chính không hoạt động"
        - "Nghiêm trọng: hệ thống không thể sử dụng"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: "8. Ghi chú thêm"
      description: "Ghi nguyên nhân nghi ngờ nếu có, không kết luận tác giả gây lỗi khi chưa xác minh. Owner sửa và kiểm tra trên main trước khi Done."
      placeholder: "Nhập ghi chú thêm..."
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: "9. Checklist xác nhận"
      options:
        - label: "Tôi xác nhận lỗi này chưa được báo cáo trước đây."
          required: true
        - label: "Tôi đã cung cấp đầy đủ thông tin môi trường và các bước tái hiện lỗi."
          required: true
