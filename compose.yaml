services:
  database:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copy .env.docker.example to .env.docker and set MSSQL_SA_PASSWORD}
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env.docker}
    ports:
      - "14333:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  database-init:
    image: mcr.microsoft.com/mssql/server:2019-latest
    depends_on:
      database:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env.docker}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S database -U sa -C -b
        -Q "IF DB_ID(N'MamXanhDB') IS NULL CREATE DATABASE [MamXanhDB];"
    restart: "no"

  backend:
    build:
      context: ./app/mamxanh-backend
    depends_on:
      database-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://database:1433;databaseName=MamXanhDB;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env.docker}
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/v1/nutrition/profile; result=$$?; test $$result -eq 0 -o $$result -eq 8"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  sample-data:
    image: mcr.microsoft.com/mssql/server:2019-latest
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env.docker}
    volumes:
      - ./database/sample-data.sql:/seed/sample-data.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S database -U sa -d MamXanhDB
        -C -b -i /seed/sample-data.sql
    restart: "no"

  frontend:
    build:
      context: ./app/mamxanh-frontend
    depends_on:
      sample-data:
        condition: service_completed_successfully
    environment:
      FIGMA_DEV_SERVER_HOST: 0.0.0.0
      VITE_OPEN_BROWSER: "false"
      BACKEND_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./app/mamxanh-frontend:/workspace
      - frontend-node-modules:/workspace/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  sqlserver-data:
  frontend-node-modules:
