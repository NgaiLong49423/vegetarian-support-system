spring.application.name=mamxanh-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Accounts live in the USER table; do not create Spring Boot's default in-memory user.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# FR-03 authentication (mamxanh.auth.*)
mamxanh.auth.email-verification-ttl=24h
mamxanh.auth.verification-resend-cooldown=60s
mamxanh.auth.bcrypt-strength=12
mamxanh.auth.frontend-base-url=${MAMXANH_FRONTEND_BASE_URL:http://localhost:5173}

# CORS allowlist: comma-separated origins, no wildcard
mamxanh.cors.allowed-origins=${MAMXANH_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Email via Brevo SMTP. Explicit placeholders so values also resolve from the local .env import;
# an empty SPRING_MAIL_HOST (or MAMXANH_MAIL_FROM) skips sending.
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
mamxanh.mail.from=${MAMXANH_MAIL_FROM:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# payOS payment gateway (FR-13, AC-13.1..AC-13.7)
mamxanh.payos.client-id=${MAMXANH_PAYOS_CLIENT_ID:}
mamxanh.payos.api-key=${MAMXANH_PAYOS_API_KEY:}
mamxanh.payos.checksum-key=${MAMXANH_PAYOS_CHECKSUM_KEY:}
mamxanh.payos.endpoint=${MAMXANH_PAYOS_ENDPOINT:https://api-merchant.payos.vn}
mamxanh.payos.return-url=${MAMXANH_PAYOS_RETURN_URL:http://localhost:5173/payment/success}
mamxanh.payos.cancel-url=${MAMXANH_PAYOS_CANCEL_URL:http://localhost:5173/payment/cancel}
