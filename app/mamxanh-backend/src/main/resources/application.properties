spring.application.name=mamxanh-backend
spring.profiles.default=${SPRING_PROFILES_ACTIVE:local,local-reset}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Accounts live in the USER table; do not create Spring Boot's default in-memory user.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# FR-03 authentication (mamxanh.auth.*)
mamxanh.auth.email-verification-ttl=24h
mamxanh.auth.verification-resend-cooldown=60s
mamxanh.auth.bcrypt-strength=12
mamxanh.auth.frontend-base-url=${MAMXANH_FRONTEND_BASE_URL:http://localhost:5173}

# FR-03-B login protection (NFR-07): 5 consecutive wrong passwords block login for 10 minutes
mamxanh.auth.max-failed-login-attempts=5
mamxanh.auth.login-block-duration=10m

# Stateless JWT access token (HS256); Q30 sets a 60-minute MVP lifetime without refresh tokens.
mamxanh.auth.access-token-ttl=60m
mamxanh.auth.jwt-secret=${MAMXANH_JWT_SECRET:}

# FR-03-D Google login: OAuth client ID that every Google ID Token must target (public, not a secret).
# Empty disables Google login: every token is rejected.
mamxanh.auth.google.client-id=${MAMXANH_GOOGLE_CLIENT_ID:}

# CORS allowlist: comma-separated origins, no wildcard
mamxanh.cors.allowed-origins=${MAMXANH_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Email via Brevo SMTP. Explicit placeholders so values also resolve from the local .env import;
# an empty SPRING_MAIL_HOST (or MAMXANH_MAIL_FROM) skips sending.
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
mamxanh.mail.from=${MAMXANH_MAIL_FROM:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Azure Blob Storage (FR-14, AC-14.1..AC-14.4)
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:mamxanh-recipes}

# Uploads: recipe images up to 5 MB (AC-14.1) and avatars up to 2 MB (AC-23.5) are checked by the
# services; the servlet limit only has to let them through (the default is 1 MB per file).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
