spring.application.name=mamxanh-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Accounts live in the USER table; do not create Spring Boot's default in-memory user.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# FR-03 authentication (mamxanh.auth.*)
mamxanh.auth.email-verification-ttl=24h
mamxanh.auth.verification-resend-cooldown=60s
mamxanh.auth.bcrypt-strength=12
mamxanh.auth.frontend-base-url=${MAMXANH_FRONTEND_BASE_URL:http://localhost:5173}

# CORS allowlist: comma-separated origins, no wildcard
mamxanh.cors.allowed-origins=${MAMXANH_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Email via Brevo SMTP. Host and credentials come from SPRING_MAIL_HOST, SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME and SPRING_MAIL_PASSWORD; without SPRING_MAIL_HOST emails are skipped.
mamxanh.mail.from=${MAMXANH_MAIL_FROM:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
