spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Local-only repeatable fixtures; production/test profiles use schema migrations only.
spring.flyway.locations=classpath:db/migration,classpath:db/demo
spring.flyway.placeholders.demoimagebaseurl=${AZURE_DEMO_RECIPE_IMAGE_BASE_URL:https://mximages438081.blob.core.windows.net/mamxanh-recipes/recipes}
spring.flyway.out-of-order=true
mamxanh.demo.password=${MAMXANH_DEMO_PASSWORD}
