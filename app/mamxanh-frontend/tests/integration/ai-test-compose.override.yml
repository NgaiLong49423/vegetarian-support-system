# Apply after the repository root docker-compose.yml; no production entry point is changed.
services:
  backend:
    image: mamxanh-g4-backend
    command: ["java", "-Dloader.path=/g4/g4-fixture.jar", "-Dloader.main=g4fixture.G4FixtureApplication", "-cp", "/g4/mamxanh-backend-0.1.0-SNAPSHOT.jar", "org.springframework.boot.loader.launch.PropertiesLauncher"]
    environment:
      GEMINI_API_KEY: ""
      SPRING_MAIL_HOST: ""
      SPRING_MAIL_USERNAME: ""
      SPRING_MAIL_PASSWORD: ""
      AZURE_STORAGE_CONNECTION_STRING: ""
      MAMXANH_PAYOS_CLIENT_ID: ""
      MAMXANH_PAYOS_API_KEY: ""
      MAMXANH_PAYOS_CHECKSUM_KEY: ""
    volumes:
      - type: bind
        source: ./app/mamxanh-backend/target
        target: /g4
        read_only: true
  frontend:
    image: mamxanh-g4-frontend
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
