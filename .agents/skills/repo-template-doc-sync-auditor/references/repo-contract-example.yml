# Example only. Do not assume these paths or policies exist in every repository.
project_type: java-webapp-template

canonical_docs:
  overview: README.md
  requirements: docs/requirements/SRS.md
  product_direction: docs/requirements/PRD.md
  changelog: CHANGELOG.md
  contribution: CONTRIBUTING.md
  database_schema: database/schema.sql
  database_readme: database/README.md
  agent_instructions: AGENTS.md

agent_paths:
  reports: .agents/outputs/reports
  drafts: .agents/outputs/drafts
  logs: .agents/outputs/logs

document_rules:
  require_metadata: true
  default_language: vi
  prefer_relative_links: true
  archived_docs_are_historical: true

requirement_rules:
  preserve_ids: true
  do_not_reuse_retired_ids: true
  example_lifecycle_states:
    - DRAFT
    - ACTIVE
    - DEFERRED
    - OUT_OF_SCOPE
    - RETIRED

sync_rules:
  - when: docs/requirements/SRS.md changes
    review_if_relevant:
      - docs/requirements/PRD.md
      - docs/architecture
      - docs/testing
      - database
      - .github/ISSUE_TEMPLATE
      - CHANGELOG.md

  - when: database changes
    review_if_relevant:
      - database/README.md
      - docs/requirements/SRS.md
      - docs/architecture

  - when: .github/labels.yml changes
    review_if_relevant:
      - .github/ISSUE_TEMPLATE
      - CONTRIBUTING.md

  - when: AGENTS.md changes
    review_if_relevant:
      - .agents/repo-contract.yml

# "review_if_relevant" means inspect for impact; it does not mean every listed file must change.
