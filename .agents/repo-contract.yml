project_type: swp391-fullstack-webapp
agent_entrypoint: AGENTS.md
policy_document: .agents/POLICY.md
document_register: docs/README.md

runtime_portability:
  vendor_neutral: true
  supported_clients: multiple_repository_capable_agents
  client_specific_commands_are_authoritative: false
  requirement: agent_can_read_repository_governance_and_selected_skills

eval_isolation:
  system_under_test: isolated_clean_local_repository
  harness_outside_evaluated_workspace: true
  hidden_artifacts_copied_to_sut: false
  evaluator_only_content: [case_definitions, expected_assertions, grading, baselines, manifests, evidence]
  tested_agent_visible_agent_paths: [AGENTS.md, .agents/POLICY.md, .agents/repo-contract.yml, .agents/skills/, .agents/workflows/]
  tested_agent_excluded_paths: [.agents/evals/, .agents/scripts/, .agents/outputs/, .agents/skills/*/evals/]
  evaluator_reads: [harness, system_under_test]
  evaluator_mutation_mode: harness_only
  leakage_result: {evidence_validity: INVALID, reason: evaluation_leakage}

authority_model:
  task_intent:
    source: user_request
    meaning: defines_requested_outcome_and_scope_not_blanket_safety_override
  project_decisions:
    order:
      - explicit_authorized_decision_in_current_task
      - CONTRIBUTING.md
      - AGENTS.md
      - docs/README.md
      - concern_specific_authoritative_document
      - selected_skill_defaults
  safety_invariants:
    source: .agents/POLICY.md
    overridable_by_normal_user_request: false
    when_conflict: stop_affected_action_and_report

capability_policy:
  read_task_relevant: allow
  local_write_requested_scope: allow_when_owning_rules_permit
  delete_rename_broad_restructure: plan_and_authority_required
  remote_write: runtime_approval_required
  destructive_remote_or_git: deny_by_default

remote_mutation_policy:
  approval_mode: one_approval_per_previewed_batch
  approval_scope: exact_previewed_targets_and_actions
  require_reapproval_if_batch_materially_changes: true
  github_read: allow_without_approval
  github_issue_mutations_requiring_approval: [create, update, close, reopen, label, assign]
  github_project_mutations_requiring_approval: [field_update, item_update]
  denied_for_ordinary_skills: [delete_issue, delete_comment, force_push, delete_branch, merge_pull_request]
  verification_required_after_execution: true

reading_policy:
  default: task_scoped_registered_documents
  unknown_files: ignore_unless_user_requested_or_directly_relevant
  source_and_tests: inspect_when_related_to_task
  auto_inventory_all_contents: false
  auto_register_unknown_files: false
  auto_delete_unknown_files: false
diagram_artifact_protection:
  path: docs/diagrams/
  agent_default_access: read_only
  prohibited_without_explicit_current_task_authorization: [create, edit, rename, delete, regenerate, export]
  authorization_requirement: user_must_name_diagram_work_and_affected_artifact
environment_configuration_policy:
  secret_categories: [passwords, api_keys, access_tokens, refresh_tokens, jwt_signing_secrets, oauth_client_secrets, cloud_storage_keys, private_keys, service_credentials]
  prohibited_locations: [source_code, tracked_configuration, env_example, documentation, test_fixtures, scripts, comments, agent_reports]
  approved_sources: [environment_variables, approved_provider_agnostic_secret_management]
  environment_dependent_configuration:
    rule: externalize_only_when_configuration_legitimately_varies_between_environments
    examples: [database_urls, service_urls, frontend_backend_origins, deployment_ports, external_service_endpoints]
  stable_configuration:
    rule: keep_directly_in_application_configuration_when_non_secret_and_stable_across_environments
    do_not_externalize_merely_for_externalization: true
    examples: [spring.application.name, spring.jpa.open-in-view]
  env_file_policy:
    local_files: [.env, .env.*]
    local_files_must_be_untracked_and_ignored: true
    tracked_contract_file: .env.example
    tracked_contract_must_not_contain_real_credentials: true
    matching_example_must_cover_all_local_env_variable_names: true
    sync_matching_example_when_local_env_variable_is: [added, removed, renamed]
    matching_example_values_must_be_safe_placeholders: true
    matching_example_scope: same_component_as_local_env
    inspect_existing_env_files_and_tracked_templates_before_gitignore_change: true
    avoid_duplicate_example_contracts_without_repository_evidence: true
  configuration_placement:
    rule: place_configuration_with_the_component_that_consumes_it
    repository_root_environment_files: repository_wide_tooling_only
    backend_runtime_configuration_scope: app/mamxanh-backend/
    frontend_runtime_configuration_scope: app/mamxanh-frontend/
    root_environment_files_must_not_be_application_runtime_catch_all: true
    identify_runtime_consumer_before_adding_or_moving_variable: true
  trackable_configuration_files:
    rule: configuration_files_may_be_tracked_when_they_contain_stable_non_secret_settings_and_supported_environment_variable_placeholders
    real_secret_and_local_runtime_values: must_remain_outside_git
    preserve_stable_non_secret_settings_directly: true
    before_tracking_existing_local_configuration: inspect_for_real_values_and_sanitize_when_needed
    do_not_unignore_or_commit_unsanitized_local_configuration: true
  frontend_public_environment:
    rule: all_client_exposed_environment_variables_are_public_after_frontend_build
    vite_default_public_prefixes: [VITE_]
    include_prefixes_configured_through: envPrefix
    secrets_forbidden_in_client_exposed_variables: true
    secret_requiring_operations: backend_only
  spring_boot_runtime_loading:
    do_not_assume_dotenv_is_loaded_automatically: true
    inspect_before_changing: [intellij_run_configurations, operating_system_environment, docker_or_compose, ci_cd, existing_configuration_loader, spring_profiles]
    prohibited_without_repository_evidence_or_explicit_approval: [dotenv_dependency, configuration_framework, bootstrap_mechanism, runtime_dependency_for_dotenv]
  configuration_duplication:
    environment_variable_contract: .env.example
    spring_profiles_are_not_replaced_by_env_example: true
    retain_profile_files_with_meaningful_behavior: true
    removal_or_consolidation_requires: evidence_of_placeholder_only_duplication_without_independent_purpose
  rotation_reporting:
    trigger: repository_evidence_of_real_credential_committed_or_exposed_through_tracked_history
    required_report: ROTATION REQUIRED
    report_fields: [credential_type, affected_file_or_location, reason]
    never_reproduce_secret_value: true
    prohibited_without_explicit_authorization: [revoke_credential, rotate_credential, rewrite_git_history, force_push, purge_repository_history]
engineering_autonomy:
  policy_reference: "CONTRIBUTING.md#engineering-autonomy-policy"
  overrides_diagram_protection: false
  local_schema_evolution:
    allowed_autonomous: [add_columns_to_existing_table, local_constraints_and_indexes, implement_approved_baseline_foreign_keys, nullability_and_defaults_compatible_with_requirements]
    requires_decision_issue_and_vote: [new_table_or_entity, drop_table, split_or_merge_table, new_or_changed_relationship_or_cardinality, cross_module_relation_redesign, breaking_data_type_change, database_engine_swap]
    rule: new_append_only_flyway_migration_and_snapshot_sync
    diagram_boundary: "docs/diagrams/ERD/ remains read-only under diagram_artifact_protection"
  auxiliary_dependencies:
    baseline_authority: "docs/architecture/TECHNOLOGY-STACK.md confirmed entries"
    allowed_autonomous: [test_libraries, validation_and_mapping_utilities, helper_client_sdks, build_and_dev_tools]
    requires_decision_issue_and_vote: [new_framework, orm_swap, auth_architecture_swap, message_broker, distributed_cache, database_driver_swap]
    rule: declare_in_manifest_with_active_usage
  api_design_evolution:
    allowed_autonomous: [new_endpoints_in_scope, new_request_response_dtos, business_validations_and_error_codes]
    documentation_rule: sync_api_md_and_openapi_yaml_in_same_work_item_or_pr
    requires_coordination_and_approval: [delete_active_endpoint, rename_endpoint, change_http_method, remove_or_rename_response_fields, change_auth_model, change_error_envelope]
progress:
  source: GitHub Issues and Projects
  evidence: linked Pull Requests
  local_reports: false
  github_project:
    name: "Vegetarian Support System — SWP391"
    owner: "NgaiLong49423"
    number: 15
    id: "PVT_kwHOCcGJZc4Bjt8o"
    url: "https://github.com/users/NgaiLong49423/projects/15"
agent_paths:
  skills: .agents/skills/
  workflows: .agents/workflows/
  evals: .agents/evals/
  acceptance_evals: .agents/evals/acceptance/
  incidents: .agents/evals/incidents/
  eval_runs: .agents/evals/runs/
  scripts: .agents/scripts/
  requested_outputs: .agents/outputs/<task>/
  bug_records: .agents/outputs/bugs/
  automatic_reports: false
quality_loops:
  evaluator_optimizer_workflow: .agents/workflows/evaluator-optimizer.md
  default_max_optimization_rounds: 3
  human_decision_status: BLOCKED_REQUIRES_DECISION
  iteration_limit_status: BLOCKED_ITERATION_LIMIT
  authorization_status: BLOCKED_AUTHORIZATION
  default_use: important_multi_artifact_or_high_impact_tasks
  evaluator_remote_mutation_mode: read_only
  remote_batch_approval: required_after_preview_before_first_write
  trivial_edits: not_required_unless_explicitly_requested
canonical_docs:
  project_overview: README.md
  product_requirements: docs/requirements/PRD.md
  software_requirements: docs/requirements/SRS.md
  functional_requirements: docs/requirements/srs/FUNCTIONAL-REQUIREMENTS.md
  business_rules: docs/requirements/srs/BUSINESS-RULES.md
  non_functional_requirements: docs/requirements/srs/NON-FUNCTIONAL-REQUIREMENTS.md
  architecture: docs/architecture/ARCHITECTURE.md
  technology_stack: docs/architecture/TECHNOLOGY-STACK.md
  backend_package_structure: docs/architecture/BACKEND-PACKAGE-STRUCTURE-PROPOSAL.md
  test_strategy: docs/testing/TEST-STRATEGY.md
  contribution_rules: CONTRIBUTING.md
  workflow: docs/decisions/001-team-workflow.md
  team_operating_agreement: docs/decisions/002-five-member-team-operating-agreement.md
  changelog: CHANGELOG.md
  database_policy: database/README.md
  labels: .github/labels.yml
database_state:
  schema_snapshot: database/schema.sql
  status: implemented_baseline_synced_with_flyway
  migration_owner: backend_flyway
requirements_baseline:
  version: v2.0.0
  scope_rule: current_srs_registry_presence_means_implementation_scope
  history: docs/archive/requirements/v1/
  acceptance_criteria_owner: docs/requirements/srs/FUNCTIONAL-REQUIREMENTS.md
  use_case_owner: docs/requirements/use-cases/
doc_sync_rules:
  - when: requirements_change
    check: [docs/requirements/SRS.md, docs/requirements/srs/FUNCTIONAL-REQUIREMENTS.md, docs/requirements/srs/BUSINESS-RULES.md, docs/requirements/srs/NON-FUNCTIONAL-REQUIREMENTS.md, docs/requirements/PRD.md, docs/architecture/ARCHITECTURE.md, docs/testing/TEST-STRATEGY.md, README.md, CHANGELOG.md]
  - when: architecture_or_technology_changes
    check: [docs/architecture/ARCHITECTURE.md, docs/architecture/TECHNOLOGY-STACK.md, docs/architecture/BACKEND-PACKAGE-STRUCTURE-PROPOSAL.md, docs/requirements/SRS.md, docs/README.md, README.md]
  - when: test_strategy_changes
    check: [docs/testing/TEST-STRATEGY.md, docs/requirements/SRS.md, CONTRIBUTING.md]
  - when: layout_or_agent_policy_changes
    check: [AGENTS.md, docs/README.md, .agents/repo-contract.yml, README.md, CONTRIBUTING.md]
  - when: workflow_changes
    check: [CONTRIBUTING.md, docs/decisions/001-team-workflow.md, docs/decisions/002-five-member-team-operating-agreement.md, .github/pull_request_template.md]
  - when: database_changes
    check: [database/README.md, database/schema.sql, app/mamxanh-backend/, docs/diagrams/ERD/]
  - when: labels_change
    check: [.github/labels.yml, .github/ISSUE_TEMPLATE/]
